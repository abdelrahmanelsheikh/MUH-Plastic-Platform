<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="114" fill="#021c1a"/>
  <defs>
    <linearGradient id="bb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#374151"/>
    </linearGradient>
    <linearGradient id="aa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <radialGradient id="sh" cx="38%" cy="30%" r="58%">
      <stop offset="0%" stop-color="rgba(255,255,255,.18)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <clipPath id="cl"><rect x="28" y="28" width="228" height="456"/></clipPath>
    <clipPath id="cr"><rect x="260" y="28" width="224" height="456"/></clipPath>
  </defs>

  <!-- Card background -->
  <rect x="28" y="28" width="456" height="456" rx="100" fill="#041c1e"/>
  <rect x="28" y="28" width="456" height="456" rx="100" fill="url(#sh)"/>

  <!-- BEFORE (left half) -->
  <g clip-path="url(#cl)">
    <ellipse cx="256" cy="252" rx="114" ry="148"
      stroke="url(#bb)" stroke-width="10"
      fill="rgba(107,114,128,.07)" stroke-dasharray="22 11"/>
    <path d="M 178 206 Q 196 188 214 206 Q 196 224 178 206Z"
      fill="url(#bb)" opacity=".65"/>
    <path d="M 256 234 L 228 298 Q 246 308 264 298"
      stroke="url(#bb)" stroke-width="8" fill="none"
      stroke-linecap="round" opacity=".5" stroke-dasharray="14 8"/>
    <path d="M 200 332 Q 228 316 256 326"
      stroke="url(#bb)" stroke-width="8" fill="none"
      stroke-linecap="round" opacity=".5" stroke-dasharray="14 8"/>
    <text x="76" y="440" font-family="monospace" font-size="32"
      fill="rgba(107,114,128,.8)" letter-spacing="3">BEFORE</text>
  </g>

  <!-- AFTER (right half) -->
  <g clip-path="url(#cr)">
    <ellipse cx="256" cy="252" rx="114" ry="148"
      stroke="url(#aa)" stroke-width="8"
      fill="rgba(45,212,191,.06)"/>
    <path d="M 298 206 Q 316 188 334 206 Q 316 224 298 206Z"
      fill="url(#aa)" opacity=".9"/>
    <path d="M 256 234 L 284 298 Q 266 308 248 298"
      stroke="url(#aa)" stroke-width="8" fill="none"
      stroke-linecap="round" opacity=".85"/>
    <path d="M 256 332 Q 284 316 314 332 Q 296 348 278 344 Q 256 348 236 344 Q 256 348 256 332Z"
      fill="url(#aa)" opacity=".65"/>
    <text x="272" y="440" font-family="monospace" font-size="32"
      fill="rgba(45,212,191,.8)" letter-spacing="3">AFTER</text>
  </g>

  <!-- Center divider line -->
  <line x1="256" y1="40" x2="256" y2="468"
    stroke="rgba(255,255,255,.55)" stroke-width="5.5"/>
</svg>
